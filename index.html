/* ---------- event wiring ---------- */
document.addEventListener('click', e => {
  if (header.classList.contains('nav-open') && !header.contains(e.target)) closeNav();
  if (e.target.classList && e.target.classList.contains('lightbox')) { closeLightbox(); return; }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'request-note') { data.draft.note = t.value; persist(); return; }
  if (t.dataset.cake === 'message') { data.draft.cake.message = t.value; persist(); return; }
  if (t.dataset.coffee) { onCoffeeInput(t); return; }
  if (t.dataset.guest) {
    data.guest[t.dataset.guest] = t.value;
    clearFieldError(t, checkout.errors, t.dataset.guest);
    return;
  }
  if (t.dataset.pay) {
    formatPayInput(t);
    checkout.pay[t.dataset.pay] = t.value;
    clearFieldError(t, checkout.errors, t.dataset.pay);
    return;
  }
  if (t.dataset.contact && t.tagName !== 'SELECT') {
    contactForm[t.dataset.contact] = t.value;
    clearFieldError(t, ui.contactErrors, t.dataset.contact);
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bed) { data.draft.bedding[t.dataset.bed] = t.checked; refreshTotals(); return; }
  if (t.dataset.cake) { onCakeChange(t); return; }
  if (t.dataset.agree) {
    checkout.agree[t.dataset.agree] = t.checked;
    if (checkout.errors.agree && checkout.agree.privacy && checkout.agree.rules) {
      delete checkout.errors.agree;
      const alert = $('#step-panel .form-alert');
      if (alert) alert.remove();
    }
    return;
  }
  if (t.classList.contains('w-name')) {
    const w = data.wishlist.find(x => x.id === t.dataset.id);
    if (!w) return;
    w.name = t.value.trim() || defaultWishName(w.sel);
    t.value = w.name;
    persist();
    toast('Name saved');
    return;
  }
  if (t.dataset.pay === 'bank') { checkout.pay.bank = t.value; clearFieldError(t, checkout.errors, 'bank'); return; }
  if (t.dataset.contact === 'topic') {
    contactForm.topic = t.value;
    renderContactPanel('[data-contact="topic"]');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (modalResolve) { modalResolve(false); return; }
    if ($('.lightbox')) { closeLightbox(); return; }
    if (header.classList.contains('nav-open')) { closeNav(); $('.nav-toggle').focus(); return; }
  }
  if ($('.lightbox')) {
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
  }
  if (e.key === 'Tab' && overlayRoot.firstElementChild) trapFocus(e);
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('w-name')) { e.preventDefault(); e.target.blur(); }
});

function clearFieldError(input, errors, key) {
  if (!errors[key]) return;
  delete errors[key];
  input.removeAttribute('aria-invalid');
  input.removeAttribute('aria-describedby');
  const msg = input.parentElement.querySelector('.field-error');
  if (msg) msg.remove();
}
function formatPayInput(t) {
  const k = t.dataset.pay;
  if (k === 'card') {
    const digits = t.value.replace(/\D/g, '').slice(0, 19);
    t.value = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
  } else if (k === 'exp') {
    let v = t.value.replace(/\D/g, '').slice(0, 4);
    if (v.length >= 3) v = v.slice(0, 2) + '/' + v.slice(2);
    t.value = v;
  } else if (k === 'cvc') {
    t.value = t.value.replace(/\D/g, '').slice(0, 4);
  }
}

/* ---------- boot ---------- */
async function boot() {
  renderHeader();
  renderFooter();
  let booted = false;
  const restoring = restore().then(ok => {
    if (!ok || !booted) return;
    // Saved data arrived after the first paint: refresh without replaying the intro.
    if (data.draft.date) ui.calMonth = startOfMonth(fromKey(data.draft.date));
    if (parseHash().name === 'home') {
      refreshBooking();
      const note = document.getElementById('request-note');
      if (note) note.value = data.draft.note;
    } else render();
    updateHeader(parseHash().name);
  });
  await Promise.race([restoring, new Promise(r => setTimeout(r, 600))]);
  booted = true;
  if (data.draft.date) ui.calMonth = startOfMonth(fromKey(data.draft.date));
  render();
  const id = ui.pendingScroll;
  if (id) afterRoute();
}
boot();
})();

</script>
</body>
</html>
