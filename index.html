<style>
:root {
  --night: #1A332B;
  --night-2: #23443A;
  --night-3: #2F5546;
  --cream: #F0E7D8;
  --paper: #F8F3EA;
  --sand: #E6DAC5;
  --line: #D8CAB2;
  --ink: #1C2E26;
  --ink-2: #3F5148;
  --muted: #58615A;
  --gold: #B17C3C;
  --gold-ink: #8A5A24;
  --gold-light: #D4A468;
  --gold-soft: #EEDDBF;
  --sage: #6E7656;
  --sage-soft: #DEDDC6;
  --clay: #A4532F;
  --ok: #2F5A3F;
  --ok-soft: #DCE5D3;
  --serif: 'Marcellus', 'Optima', 'Candara', 'Palatino Linotype', Georgia, serif;
  --sans: 'Jost', 'Futura', 'Century Gothic', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --header-h: 68px;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 400 1rem/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--gold-ink); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; font-weight: 400; }
p { margin: 0 0 1em; }
dl, dd { margin: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.site-header :focus-visible,
.hero :focus-visible,
.site-footer :focus-visible,
.custom-theme :focus-visible,
.lightbox :focus-visible { outline-color: var(--gold-light); }
main:focus { outline: none; }
body.no-scroll { overflow: hidden; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 1rem; top: -100px; z-index: 200;
  background: var(--paper); color: var(--ink); padding: .5rem 1rem; border-radius: 8px;
}
.skip:focus { top: .75rem; }
.wrap { width: min(1160px, 100% - 2.5rem); margin-inline: auto; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 46px; padding: 0 1.375rem;
  border: 1px solid transparent; border-radius: 999px;
  font: 500 1rem/1.2 var(--sans); text-decoration: none; white-space: nowrap;
  cursor: pointer; transition: background-color .15s, border-color .15s, color .15s;
}
.btn svg { flex-shrink: 0; }
.btn-primary { background: var(--night); color: var(--paper); }
.btn-primary:hover { background: var(--night-3); }
.btn-gold { background: var(--gold-light); color: var(--night); }
.btn-gold:hover { background: #DFB57E; }
.btn-ghost-light { border-color: rgba(240, 231, 216, .42); color: var(--cream); }
.btn-ghost-light:hover { border-color: var(--cream); background: rgba(240, 231, 216, .08); }
.btn-quiet { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-quiet:hover { border-color: var(--ink-2); background: rgba(28, 46, 38, .04); }
.btn-danger { background: var(--clay); color: var(--paper); }
.btn-danger:hover { background: #8C4426; }
.btn-danger-text { color: var(--clay); }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 0 1rem; font-size: .875rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px;
  border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer;
}
.icon-btn:hover:not([disabled]) { background: rgba(28, 46, 38, .07); }
.icon-btn[disabled] { opacity: .35; cursor: default; }
.icon-btn-line { border: 1px solid var(--line); width: 36px; height: 36px; }
.link-btn {
  padding: 0; border: 0; background: none; cursor: pointer;
  color: var(--gold-ink); font: inherit; font-weight: 500;
  text-decoration: underline; text-underline-offset: 3px;
}

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 50; background: var(--night); color: var(--cream); }
.header-inner { position: relative; display: flex; align-items: center; gap: .5rem; height: var(--header-h); }
.brand {
  display: flex; align-items: center; gap: .75rem; margin-right: auto;
  color: inherit; text-decoration: none; border-radius: 999px;
}
.brand img { width: 44px; height: 44px; border-radius: 50%; }
.brand-name { font-family: var(--serif); font-size: 1.3125rem; line-height: 1; letter-spacing: .01em; }
.site-nav { display: none; }
.site-nav a {
  display: block; padding: .5rem .875rem; border-radius: 999px;
  color: rgba(240, 231, 216, .82); text-decoration: none; font-weight: 500;
}
.site-nav a:hover { color: var(--cream); background: rgba(240, 231, 216, .08); }
.site-nav a[aria-current="page"] { color: var(--night); background: var(--gold-light); }
.wish-link {
  position: relative; display: inline-grid; place-items: center;
  width: 44px; height: 44px; border-radius: 50%; color: var(--cream);
}
.wish-link:hover { background: rgba(240, 231, 216, .08); }
.wish-count {
  position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; background: var(--gold-light); color: var(--night);
  font-size: .6875rem; font-weight: 600; line-height: 18px; text-align: center;
}
.nav-toggle { color: var(--cream); width: 44px; height: 44px; }
.nav-toggle:hover { background: rgba(240, 231, 216, .08) !important; }
.site-header.nav-open .site-nav {
  display: flex; flex-direction: column; gap: .25rem;
  position: absolute; top: var(--header-h); left: -1.25rem; right: -1.25rem;
  padding: .5rem 1.25rem 1.25rem; background: var(--night);
  border-top: 1px solid rgba(240, 231, 216, .12);
  box-shadow: 0 24px 30px -24px rgba(0, 0, 0, .6);
}
@media (min-width: 860px) {
  .site-nav,
  .site-header.nav-open .site-nav {
    display: flex; flex-direction: row; gap: .25rem; position: static;
    padding: 0; border: 0; box-shadow: none; background: none;
  }
  .nav-toggle { display: none; }
  .wish-link { margin-left: .5rem; }
}

/* ---------- Hero: the logo rises as the moon ---------- */
.hero {
  position: relative; isolation: isolate; overflow: hidden;
  background: var(--night); color: var(--cream); text-align: center;
  padding: 2.75rem 0 5.25rem;
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -2;
  background:
    radial-gradient(1.5px 1.5px at 18% 28%, rgba(240, 231, 216, .7), transparent 60%),
    radial-gradient(1px 1px at 33% 72%, rgba(240, 231, 216, .6), transparent 60%),
    radial-gradient(1.5px 1.5px at 58% 16%, rgba(240, 231, 216, .5), transparent 60%),
    radial-gradient(1px 1px at 76% 58%, rgba(240, 231, 216, .6), transparent 60%),
    radial-gradient(1px 1px at 91% 12%, rgba(240, 231, 216, .6), transparent 60%),
    radial-gradient(1.5px 1.5px at 6% 62%, rgba(240, 231, 216, .5), transparent 60%),
    radial-gradient(1px 1px at 46% 92%, rgba(240, 231, 216, .4), transparent 60%),
    radial-gradient(1px 1px at 67% 80%, rgba(240, 231, 216, .5), transparent 60%),
    radial-gradient(ellipse 70% 55% at 50% 28%, rgba(47, 85, 70, .85), transparent 70%);
}
.hero::after {
  content: ""; position: absolute; z-index: -1; left: -15%; right: -15%; bottom: -1px; height: 64px;
  background: var(--cream); border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}
.hero-stars { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.hero-star { position: absolute; color: var(--gold-light); opacity: .85; }
.hero-star:nth-child(3n) { color: var(--cream); opacity: .45; }
.moon { position: relative; width: clamp(196px, 30vw, 300px); aspect-ratio: 1; margin: 0 auto 2rem; }
.moon-halo {
  position: absolute; inset: -34%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(240, 231, 216, .26) 0%, rgba(212, 164, 104, .12) 38%, rgba(26, 51, 43, 0) 68%);
}
.moon-logo {
  position: relative; width: 100%; height: 100%; border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(212, 164, 104, .4), 0 24px 60px -20px rgba(0, 0, 0, .55);
}
.hero-title {
  font: 400 clamp(2.25rem, 6vw, 3.75rem)/1.08 var(--serif);
  margin: 0 auto .75rem; max-width: 18ch; text-wrap: balance;
}
.hero-sub {
  font-size: 1.125rem; line-height: 1.55; color: rgba(240, 231, 216, .82);
  max-width: 34ch; margin: 0 auto 1.75rem; text-wrap: pretty;
}
.hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
.hero-facts {
  list-style: none; margin: 2rem auto 0; padding: 0;
  display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem 1.75rem;
  font-size: .9375rem; color: rgba(240, 231, 216, .8);
}
.hero-facts li { display: flex; align-items: center; gap: .5rem; }
.hero-facts svg { color: var(--gold-light); }
.hero.is-intro .moon { animation: moonrise 1.6s cubic-bezier(.2, .7, .2, 1) both; }
.hero.is-intro .moon-halo { animation: halo 2.6s ease-out .4s both; }
.hero.is-intro .hero-star { animation: starin 1.2s ease-out both; animation-delay: calc(.6s + var(--d, 0s)); }
.hero.is-intro .hero-title,
.hero.is-intro .hero-sub,
.hero.is-intro .hero-actions,
.hero.is-intro .hero-facts { animation: fadein .9s ease-out .55s both; }
@keyframes moonrise { from { opacity: 0; transform: translateY(48px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes halo { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
@keyframes starin { from { opacity: 0; transform: scale(.4); } }
@keyframes fadein { from { opacity: 0; } }

/* ---------- Gallery ---------- */
.gallery-wrap { position: relative; }
.gallery {
  display: flex; gap: .625rem; overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; border-radius: 20px;
}
.gallery::-webkit-scrollbar { display: none; }
.g-item {
  flex: 0 0 86%; aspect-ratio: 3 / 2; scroll-snap-align: start;
  padding: 0; border: 0; border-radius: 20px; overflow: hidden;
  background: var(--sand); cursor: zoom-in;
}
.g-item > svg, .g-item > img { width: 100%; height: 100%; object-fit: cover; }
.g-all {
  position: absolute; right: .875rem; bottom: .875rem;
  background: var(--paper); border-color: transparent;
  box-shadow: 0 6px 16px -8px rgba(26, 51, 43, .5);
}
.g-all:hover { background: #FFFDF8; border-color: transparent; }
@media (min-width: 720px) {
  .gallery {
    display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: .5rem; height: clamp(340px, 40vw, 470px); overflow: hidden;
  }
  .g-item { aspect-ratio: auto; border-radius: 0; }
  .g-main { grid-row: span 2; }
}

/* ---------- Stay layout ---------- */
.stay-layout { display: grid; margin-top: 2.5rem; }
.stay-main { min-width: 0; }
.block { padding: 2.5rem 0; border-top: 1px solid var(--line); }
.stay-main > .block:first-child { padding-top: 0; border-top: 0; }
.block-title { font: 400 clamp(1.5rem, 3vw, 2.25rem)/1.15 var(--serif); margin-bottom: .5rem; }
.block-sub { color: var(--muted); margin-bottom: 1.5rem; max-width: 60ch; }
@media (min-width: 1024px) {
  .stay-layout { grid-template-columns: minmax(0, 1fr) 360px; gap: 4rem; align-items: start; }
  .stay-aside { position: sticky; top: calc(var(--header-h) + 1.5rem); }
}
@media (max-width: 1023px) {
  .stay-aside { padding-top: 2.5rem; border-top: 1px solid var(--line); }
}

.about-text p { font-size: 1.125rem; line-height: 1.7; max-width: 62ch; }
.highlights { list-style: none; padding: 0; margin: 1.75rem 0 0; display: grid; gap: 1.25rem; }
.highlights li { display: grid; grid-template-columns: 44px 1fr; gap: 1rem; align-items: start; }
.hl-icon {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sage-soft); color: var(--night);
}
.highlights h3 { font-size: 1.125rem; font-weight: 600; margin: .125rem 0; }
.highlights p { margin: 0; color: var(--muted); }

/* ---------- Calendar + slots ---------- */
.picker { display: grid; gap: 1.25rem; }
@media (min-width: 720px) { .picker { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }
.calendar { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 1rem 1rem 1.125rem; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
.cal-title { font: 400 1.3125rem/1.2 var(--serif); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal-dow { text-align: center; font-size: .75rem; font-weight: 500; color: var(--muted); padding: .25rem 0 .375rem; }
.cal-day {
  aspect-ratio: 1; min-height: 38px; padding: 0; border: 0; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: transparent; color: var(--ink); font: 500 .9375rem/1 var(--sans); cursor: pointer;
}
.cal-day:hover:not([disabled]):not(.is-selected) { background: var(--sand); }
.cal-day[disabled] { color: #A6A193; cursor: default; }
.cal-day.is-today .d-num { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.cal-day.is-selected { background: var(--night); color: var(--paper); }
.d-phase { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.phase-full { background: var(--gold); }
.phase-half { background: linear-gradient(90deg, transparent 50%, var(--gold) 50%); box-shadow: inset 0 0 0 1.5px var(--gold); }
.phase-none { box-shadow: inset 0 0 0 1.5px #ADA696; }
.cal-day.is-selected .phase-full { background: var(--gold-light); }
.cal-day.is-selected .phase-half { background: linear-gradient(90deg, transparent 50%, var(--gold-light) 50%); box-shadow: inset 0 0 0 1.5px var(--gold-light); }
.cal-legend {
  list-style: none; padding: .75rem 0 0; margin: .75rem 0 0; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: .375rem 1rem; font-size: .875rem; color: var(--muted);
}
.cal-legend li { display: flex; align-items: center; gap: .5rem; }

.slots { display: grid; gap: .625rem; }
.slot {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .875rem;
  width: 100%; padding: .875rem 1rem; text-align: left;
  border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
  color: var(--ink); cursor: pointer;
}
.slot:hover:not([disabled]) { border-color: var(--ink-2); }
.slot.is-selected { border-color: var(--night); box-shadow: inset 0 0 0 1px var(--night); background: #FCF9F3; }
.slot[disabled] { cursor: not-allowed; background: transparent; }
.slot[disabled] .slot-text, .slot[disabled] .slot-icon, .slot[disabled] .slot-price { opacity: .5; }
.slot-icon {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sand); color: var(--night);
}
.slot.is-selected .slot-icon { background: var(--night); color: var(--gold-light); }
.slot-name { display: block; font-weight: 500; }
.slot-time { display: block; font-size: .875rem; color: var(--muted); }
.slot-end { text-align: right; }
.slot-price { display: block; font-weight: 600; }
.slot-status { display: block; font-size: .75rem; font-weight: 500; color: var(--clay); }
.slots-hint { margin: .25rem 0 0; font-size: .875rem; color: var(--muted); }
.guests {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  margin-top: .625rem; padding: .75rem 1rem;
  border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
}
.guests-label { display: block; font-weight: 500; }
.guests-hint { display: block; font-size: .875rem; color: var(--muted); }
.stepper-ctl { display: flex; align-items: center; gap: .75rem; }
.stepper-ctl output { min-width: 1.5ch; text-align: center; font-weight: 600; font-size: 1.125rem; }

/* ---------- Amenities ---------- */
.amenities {
  list-style: none; padding: 0; margin: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem 1.25rem;
}
@media (min-width: 720px) { .amenities { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem 1.5rem; } }
.amenities li { display: flex; align-items: center; gap: .75rem; }
.amenities svg { color: var(--sage); flex-shrink: 0; }

/* ---------- Theme add-ons (home) ---------- */
.theme-picker { display: grid; gap: .75rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 560px) { .theme-picker { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.theme-opt {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: .375rem;
  width: 100%; height: 100%; padding: 1rem; text-align: left;
  border: 1px solid var(--line); border-radius: 16px; background: var(--paper);
  color: var(--ink); cursor: pointer;
}
.theme-opt:hover:not([disabled]) { border-color: var(--ink-2); }
.theme-opt.is-selected { border-color: var(--night); box-shadow: inset 0 0 0 1px var(--night); background: #FCF9F3; }
.theme-opt[disabled] { cursor: not-allowed; background: transparent; }
.theme-opt[disabled] > :not(.t-meta) { opacity: .5; }
.t-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; margin-bottom: .25rem; }
.t-icon {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sage-soft); color: var(--night);
}
.theme-opt.is-selected .t-icon { background: var(--night); color: var(--gold-light); }
.t-check {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); color: transparent;
}
.theme-opt.is-selected .t-check { background: var(--night); border-color: var(--night); color: var(--paper); }
.t-name { font-weight: 600; line-height: 1.3; }
.t-blurb { font-size: .875rem; color: var(--muted); line-height: 1.5; }
.t-meta { margin-top: auto; padding-top: .5rem; display: flex; flex-direction: column; gap: .125rem; font-size: .875rem; }
.t-price { font-weight: 600; color: var(--gold-ink); }
.t-slots { color: var(--muted); }
.t-slots.is-blocked { color: var(--clay); }
.addon-more { margin: 1rem 0 0; }
.request { display: block; margin-top: 1.5rem; }
.request-label { display: block; font-weight: 500; margin-bottom: .375rem; }
.request-hint { display: block; margin-top: .375rem; font-size: .875rem; color: var(--muted); }

input, select, textarea {
  width: 100%; padding: .75rem .875rem;
  border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink);
}
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: #8C8F86; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--clay); }
input[type="checkbox"] { width: 20px; height: 20px; padding: 0; margin: 2px 0 0; accent-color: var(--night); flex-shrink: 0; }

/* ---------- Your stay summary ---------- */
.summary {
  background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 1.5rem;
  box-shadow: 0 1px 2px rgba(26, 51, 43, .05), 0 22px 44px -24px rgba(26, 51, 43, .35);
}
.sc-title { font: 400 1.3125rem/1.2 var(--serif); margin-bottom: .75rem; }
.sc-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: .375rem; margin-bottom: 1rem; }
.sc-amount { font: 400 2.25rem/1 var(--serif); }
.sc-from, .sc-per { color: var(--muted); }
.sc-rows { border: 1px solid var(--line); border-radius: 14px; }
.sc-rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .75rem .875rem; border-top: 1px solid var(--line); }
.sc-rows > div:first-child { border-top: 0; }
.sc-rows dt { color: var(--muted); font-size: .875rem; flex-shrink: 0; }
.sc-rows dd { text-align: right; font-weight: 500; }
.sc-sub { display: block; font-size: .8125rem; font-weight: 400; color: var(--muted); }
.sc-total { display: flex; justify-content: space-between; align-items: baseline; margin: 1.125rem 0 .125rem; font-weight: 600; font-size: 1.125rem; }
.sc-tax { font-size: .75rem; color: var(--muted); margin-bottom: 1rem; }
.sc-hint { font-size: .875rem; color: var(--muted); text-align: center; margin: .5rem 0 0; }
.summary .btn-quiet { margin-top: .625rem; }
.sc-note { font-size: .8125rem; color: var(--muted); margin: 1rem 0 0; text-align: center; }

/* ---------- Mobile booking bar ---------- */
.mbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; align-items: center; gap: 1rem;
  padding: .75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom));
  background: var(--paper); border-top: 1px solid var(--line);
  box-shadow: 0 -10px 24px -14px rgba(26, 51, 43, .35);
}
.mbar-info { flex: 1; min-width: 0; }
.mbar-info strong { display: block; font-size: 1.125rem; line-height: 1.3; }
.mbar-info span { display: block; font-size: .875rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.has-mbar { padding-bottom: 80px; }
@media (min-width: 1024px) {
  .mbar { display: none; }
  body.has-mbar { padding-bottom: 0; }
}

/* ---------- Inner pages ---------- */
.page-head { padding: 3rem 0 1.75rem; }
.page-head h1 { font: 400 clamp(2.25rem, 5vw, 3rem)/1.1 var(--serif); margin-bottom: .5rem; }
.page-head p { color: var(--muted); max-width: 56ch; font-size: 1.125rem; margin: 0; }

.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: 1.75rem; }
.tab {
  display: flex; align-items: center; gap: .5rem; padding: .75rem 1rem; margin-bottom: -1px;
  border-bottom: 2px solid transparent; color: var(--muted); text-decoration: none; font-weight: 500;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--night); }
.count { font-size: .75rem; font-weight: 600; background: var(--sand); color: var(--ink-2); border-radius: 999px; padding: .0625rem .5rem; }
.list-h { font: 400 1.5rem/1.2 var(--serif); margin: 0 0 1rem; }
.list-h + .bk-list { margin-bottom: 2.5rem; }

.bk-list, .wish-list { display: grid; gap: 1rem; }
.booking {
  display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 1.25rem;
  padding: 1.25rem; background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
}
.booking.is-new { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.b-date {
  align-self: start; display: flex; flex-direction: column; align-items: center; padding: .75rem .5rem;
  border-radius: 14px; background: var(--night); color: var(--cream); text-align: center;
}
.booking.is-cancelled .b-date { background: var(--sand); color: var(--ink-2); }
.b-dow, .b-mon { font-size: .75rem; opacity: .85; }
.b-day { font: 400 2.25rem/1.05 var(--serif); }
.b-top { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.b-top h3 { font-size: 1.125rem; font-weight: 600; margin-right: auto; }
.b-time { color: var(--muted); margin: .125rem 0 0; }
.chip { font-size: .75rem; font-weight: 600; padding: .25rem .625rem; border-radius: 999px; }
.chip-ok { background: var(--ok-soft); color: var(--ok); }
.chip-muted { background: var(--sand); color: var(--ink-2); }
.chip-gold { background: var(--gold-soft); color: #6E4718; }
.b-meta, .w-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem 1.25rem; margin: 1rem 0 0; }
.b-meta dt, .w-meta dt { font-size: .75rem; color: var(--muted); }
.b-meta dd, .w-meta dd { font-weight: 500; overflow-wrap: anywhere; }
.b-note { display: flex; gap: .5rem; align-items: flex-start; margin: 1rem 0 0; padding: .625rem .875rem; border-radius: 12px; background: var(--cream); color: var(--ink-2); font-size: .9375rem; }
.b-note svg { margin-top: 3px; flex-shrink: 0; color: var(--sage); }
.b-actions, .w-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.125rem; }
@media (max-width: 520px) {
  .booking { grid-template-columns: 1fr; }
  .b-date { flex-direction: row; gap: .5rem; align-items: baseline; justify-self: start; padding: .5rem .875rem; }
  .b-day { font-size: 1.5rem; }
}

.wish { padding: 1.25rem; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; }
.w-head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; }
.w-name-wrap { position: relative; flex: 1; min-width: 200px; display: flex; align-items: center; }
.w-name {
  padding: .375rem 2rem .375rem .5rem; margin-left: -.5rem; border-color: transparent; background: transparent;
  font: 400 1.3125rem/1.3 var(--serif);
}
.w-name:hover { border-color: var(--line); }
.w-name-wrap svg { position: absolute; right: .5rem; color: var(--muted); pointer-events: none; }
.w-saved { font-size: .875rem; color: var(--muted); }
.w-status { display: flex; align-items: center; gap: .5rem; margin: 1rem 0 0; font-size: .9375rem; font-weight: 500; }
.w-status.is-ok { color: var(--ok); }
.w-status.is-warn { color: #7E4A1C; }

.empty { text-align: center; padding: 3rem 1.5rem; border: 1px dashed var(--line); border-radius: 24px; }
.empty-moon {
  width: 64px; height: 64px; margin: 0 auto 1.25rem; border-radius: 50%;
  background: var(--gold-soft); box-shadow: inset -16px 6px 0 0 var(--cream);
}
.empty h2 { font: 400 1.5rem/1.2 var(--serif); margin-bottom: .5rem; }
.empty p { color: var(--muted); max-width: 44ch; margin: 0 auto 1.5rem; }

/* ---------- Themes page ---------- */
.theme-list { display: grid; gap: 1.25rem; }
.theme-card {
  display: grid; gap: 1.25rem 2rem; padding: clamp(1.25rem, 3vw, 2rem);
  background: var(--paper); border: 1px solid var(--line); border-radius: 24px;
}
.theme-card.is-selected { border-color: var(--night); box-shadow: inset 0 0 0 1px var(--night); }
.tc-art {
  width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center;
  background: var(--night); color: var(--gold-light);
  box-shadow: inset -12px 8px 0 0 var(--night-3);
}
.tc-body h2 { font: 400 1.5rem/1.2 var(--serif); margin-bottom: .5rem; }
.tc-desc { color: var(--ink-2); max-width: 60ch; }
.tc-h { font-size: .875rem; font-weight: 600; margin: 1rem 0 .5rem; }
.tc-includes { list-style: none; padding: 0; margin: 0 0 1.25rem; display: grid; gap: .5rem 1.25rem; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.tc-includes li { display: flex; gap: .5rem; align-items: flex-start; }
.tc-includes svg { color: var(--sage); margin-top: 4px; flex-shrink: 0; }
.tc-facts { display: flex; flex-wrap: wrap; gap: .75rem 2rem; }
.tc-facts dt { font-size: .75rem; color: var(--muted); }
.tc-facts dd { font-weight: 500; }
.tc-side { display: flex; flex-direction: column; gap: .75rem; }
.tc-price { font: 400 2.25rem/1 var(--serif); margin: 0; }
.tc-per { display: block; margin-top: .375rem; font: 400 .875rem/1.3 var(--sans); color: var(--muted); }
.tc-added { display: flex; align-items: center; gap: .5rem; margin: 0; color: var(--ok); font-weight: 500; }
@media (min-width: 900px) {
  .theme-card { grid-template-columns: 88px minmax(0, 1fr) 220px; align-items: start; }
  .tc-side { padding-left: 2rem; border-left: 1px solid var(--line); align-self: stretch; }
}
.custom-theme {
  margin-top: 3rem; padding: clamp(1.5rem, 4vw, 3rem); border-radius: 28px;
  background: var(--night); color: var(--cream);
  display: grid; gap: 1.5rem; align-items: center;
}
.custom-theme h2 { font: 400 clamp(1.5rem, 3vw, 2.25rem)/1.15 var(--serif); margin-bottom: .5rem; }
.custom-theme p { color: rgba(240, 231, 216, .8); max-width: 52ch; margin: 0; }
@media (min-width: 760px) { .custom-theme { grid-template-columns: 1fr auto; } }

/* ---------- Support page ---------- */
.support-grid { display: grid; gap: 2.5rem; }
.support-main { min-width: 0; }
@media (min-width: 1024px) {
  .support-grid { grid-template-columns: minmax(0, 1fr) 400px; gap: 4rem; align-items: start; }
  .support-aside { position: sticky; top: calc(var(--header-h) + 1.5rem); }
}
.contact-ways { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 1rem; }
.contact {
  display: flex; align-items: center; gap: .875rem; padding: 1rem;
  border: 1px solid var(--line); border-radius: 16px; background: var(--paper);
  color: var(--ink); text-decoration: none;
}
.contact:hover { border-color: var(--ink-2); }
.contact-icon {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  background: var(--night); color: var(--gold-light);
}
.contact strong { display: block; font-weight: 600; }
.contact small { display: block; font-size: .875rem; color: var(--muted); }
.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding: 1rem 0; list-style: none; cursor: pointer; font-weight: 500; font-size: 1.0625rem;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { flex-shrink: 0; color: var(--muted); transition: transform .2s; }
.faq details[open] summary svg { transform: rotate(180deg); }
.faq details p { color: var(--ink-2); max-width: 64ch; margin: 0 0 1.125rem; }
.rules { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
.rules li { display: flex; gap: .75rem; align-items: flex-start; }
.rules svg { color: var(--sage); flex-shrink: 0; margin-top: 3px; }
.prose p, .prose-p { color: var(--ink-2); max-width: 64ch; }
.prose h3 { font-size: 1rem; font-weight: 600; margin: 1.25rem 0 .25rem; }
.prose h3:first-child { margin-top: 0; }

/* ---------- Panels, forms, checkout ---------- */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: clamp(1.25rem, 3vw, 2rem); }
.panel h2 { font: 400 1.5rem/1.2 var(--serif); margin-bottom: 1rem; }
.panel h2:focus { outline: none; }
.panel h2 + .panel-sub { margin-top: -.5rem; }
.panel-sub { color: var(--muted); margin-bottom: 1.25rem; }
.panel-gap { margin-top: 2.25rem; }
.fields { display: grid; gap: 1rem; }
@media (min-width: 640px) {
  .fields.two { grid-template-columns: 1fr 1fr; }
  .field-wide { grid-column: 1 / -1; }
}
.field { display: flex; flex-direction: column; gap: .375rem; }
.field-label { font-size: .875rem; font-weight: 500; }
.field-error { font-size: .8125rem; color: var(--clay); }
.field-hint { font-size: .8125rem; color: var(--muted); }
.policy-box {
  max-height: 230px; overflow: auto; padding: 1rem 1.125rem;
  border: 1px solid var(--line); border-radius: 14px; background: var(--cream);
  font-size: .9375rem; line-height: 1.6;
}
.policy-box h3 { font-size: .9375rem; font-weight: 600; margin: 1rem 0 .125rem; }
.policy-box h3:first-child { margin-top: 0; }
.policy-box p { margin: 0; color: var(--ink-2); }
.check { display: flex; gap: .75rem; align-items: flex-start; margin-top: .875rem; cursor: pointer; }
.more-policy { margin-top: 1rem; font-size: .9375rem; }
.more-policy summary { cursor: pointer; color: var(--gold-ink); font-weight: 500; }
.more-policy[open] summary { margin-bottom: .5rem; }
.more-policy ul { margin: 0; padding-left: 1.25rem; color: var(--ink-2); }
.form-alert { margin: 1rem 0 0; padding: .75rem 1rem; border-radius: 12px; background: #F4DED2; color: #7A3418; font-size: .9375rem; }
.step-actions { display: flex; justify-content: flex-end; gap: .75rem; margin-top: 2rem; }

.checkout { padding-top: 2rem; }
.link-back {
  display: inline-flex; align-items: center; gap: .25rem; padding: .25rem 0; border: 0; background: none;
  color: var(--ink-2); font-weight: 500; cursor: pointer;
}
.link-back:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.checkout-title { font: 400 clamp(2.25rem, 5vw, 3rem)/1.1 var(--serif); margin: .75rem 0 0; }
.stepper { list-style: none; padding: 0; margin: 1.5rem 0 2rem; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
.step { display: flex; flex-direction: column; gap: .5rem; font-size: .875rem; color: var(--muted); line-height: 1.3; }
.step::before { content: ""; height: 4px; border-radius: 4px; background: var(--line); }
.step.is-done, .step.is-current { color: var(--ink); }
.step.is-done::before, .step.is-current::before { background: var(--night); }
.step.is-current { font-weight: 600; }
.step-n { margin-right: .375rem; }
.checkout-grid { display: grid; gap: 1.5rem; }
.checkout-main { min-width: 0; }
@media (min-width: 1024px) {
  .checkout-grid { grid-template-columns: minmax(0, 1fr) 360px; gap: 3rem; align-items: start; }
  .checkout-aside { position: sticky; top: calc(var(--header-h) + 1.5rem); }
}
.order { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 1.5rem; }
.order-head { display: flex; align-items: center; gap: .875rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
.order-head img { width: 52px; height: 52px; border-radius: 50%; }
.order-title { font: 400 1.125rem/1.25 var(--serif); margin: 0; }
.order-sub { font-size: .875rem; color: var(--muted); margin: 0; }
.order-list, .order-price { display: grid; gap: .625rem; padding: 1rem 0; }
.order-list { border-bottom: 1px solid var(--line); }
.order-list > div, .order-price > div { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
.order-list dt { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .875rem; }
.order-list dd, .order-price dd { text-align: right; font-weight: 500; }
.order-price dt { color: var(--ink-2); }
.order-total { padding-top: .75rem; border-top: 1px solid var(--line); font-weight: 600; font-size: 1.125rem; }
.order-total dt { color: var(--ink) !important; }
.order-price { padding-bottom: 0; }

.preview { display: grid; gap: 1rem; }
.pv { padding: 1rem 1.125rem; border: 1px solid var(--line); border-radius: 16px; background: #FCF9F3; }
.pv-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .625rem; }
.pv-head h3 { font-size: 1rem; font-weight: 600; }
.pv-list { display: grid; gap: .5rem; }
.pv-list > div { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 1rem; }
.pv-list dt { color: var(--muted); font-size: .9375rem; }
.pv-list dd { font-weight: 500; overflow-wrap: anywhere; }
.pv-total { padding-top: .5rem; margin-top: .25rem; border-top: 1px solid var(--line); }
.pv-total dt, .pv-total dd { color: var(--ink); font-weight: 600; font-size: 1.0625rem; }
.pv p { margin: 0; color: var(--ink-2); }
@media (max-width: 480px) { .pv-list > div { grid-template-columns: 1fr; gap: 0; } }

.demo-note { display: flex; gap: .625rem; align-items: flex-start; padding: .75rem 1rem; margin-bottom: 1.25rem; border-radius: 12px; background: var(--gold-soft); color: #5E3E17; font-size: .875rem; }
.demo-note svg { flex-shrink: 0; margin-top: 2px; }
.pay-methods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin-bottom: 1.25rem; }
.pay-method {
  display: flex; flex-direction: column; align-items: center; gap: .375rem; padding: .875rem .5rem;
  border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
  color: var(--ink); font-weight: 500; font-size: .9375rem; cursor: pointer;
}
.pay-method:hover { border-color: var(--ink-2); }
.pay-method[aria-checked="true"] { border-color: var(--night); box-shadow: inset 0 0 0 1px var(--night); background: #FCF9F3; }
.pay-method[aria-checked="true"] svg { color: var(--gold-ink); }
.btn-pay { margin-top: 1.5rem; min-height: 54px; font-size: 1.0625rem; }
.secure-note { display: flex; justify-content: center; align-items: center; gap: .375rem; margin: .875rem 0 0; font-size: .8125rem; color: var(--muted); text-align: center; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(248, 243, 234, .35); border-top-color: var(--paper);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.confirm { max-width: 600px; margin: 0 auto; text-align: center; padding: 1rem 0 1rem; }
.confirm-mark {
  width: 96px; height: 96px; margin: 0 auto 1.5rem; border-radius: 50%;
  display: grid; place-items: center; background: var(--night); color: var(--gold-light);
  animation: pop .55s cubic-bezier(.2, .9, .3, 1.25) both;
}
.confirm-mark path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .35s ease-out forwards; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.confirm h2 { font: 400 clamp(2.25rem, 5vw, 3rem)/1.1 var(--serif); margin-bottom: .75rem; }
.confirm-lead { color: var(--ink-2); font-size: 1.0625rem; max-width: 46ch; margin: 0 auto; }
.confirm-id {
  display: inline-flex; flex-direction: column; gap: .125rem; margin: 1.5rem 0;
  padding: .875rem 1.75rem; border: 1px dashed var(--gold); border-radius: 14px; background: var(--paper);
}
.confirm-id span { font-size: .8125rem; color: var(--muted); }
.confirm-id strong { font-size: 1.3125rem; letter-spacing: .06em; }
.confirm-list { text-align: left; display: grid; gap: .625rem; padding: 1.25rem 1.5rem; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); }
.confirm-list > div { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
.confirm-list dt { color: var(--muted); }
.confirm-list dd { text-align: right; font-weight: 500; }
.confirm-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 1.75rem; }

.contact-panel h2 { margin-bottom: 1.25rem; }
.sent { text-align: center; padding: 1rem 0; }
.sent .confirm-mark { width: 72px; height: 72px; }
.sent p { color: var(--ink-2); }

/* ---------- Overlays ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 4.5rem 1rem; background: rgba(14, 28, 23, .94); animation: fadein .2s ease-out;
}
.lb-figure { margin: 0; width: min(980px, 100%); }
.lb-frame { aspect-ratio: 3 / 2; border-radius: 16px; overflow: hidden; background: var(--sand); }
.lb-frame > svg, .lb-frame > img { width: 100%; height: 100%; object-fit: cover; }
.lb-figure figcaption { display: flex; justify-content: space-between; gap: 1rem; margin-top: .875rem; color: var(--cream); font-size: .9375rem; }
.lb-btn {
  position: absolute; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid rgba(240, 231, 216, .3); background: rgba(26, 51, 43, .7); color: var(--cream); cursor: pointer;
}
.lb-btn:hover { background: var(--night-3); }
.lb-close { top: 1rem; right: 1rem; }
.lb-prev { left: 1rem; top: 50%; transform: translateY(-50%); }
.lb-next { right: 1rem; top: 50%; transform: translateY(-50%); }
@media (max-width: 719px) {
  .lb-prev, .lb-next { top: auto; bottom: 1.25rem; transform: none; }
  .lb-prev { left: calc(50% - 56px); }
  .lb-next { right: calc(50% - 56px); }
}
.modal-backdrop { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 1.25rem; background: rgba(14, 28, 23, .55); animation: fadein .15s ease-out; }
.modal { width: min(440px, 100%); padding: 1.5rem; border-radius: 20px; background: var(--paper); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .45); }
.modal h2 { font: 400 1.5rem/1.2 var(--serif); margin-bottom: .5rem; }
.modal p { color: var(--ink-2); margin-bottom: 1.5rem; }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .5rem; }

#toast {
  position: fixed; left: 50%; bottom: 1.5rem; z-index: 120; max-width: calc(100% - 2rem);
  padding: .75rem 1.25rem; border-radius: 999px; background: var(--gold-light); color: var(--night); font-weight: 500;
  font-size: .9375rem; text-align: center; opacity: 0; pointer-events: none;
  transform: translate(-50%, 12px); transition: opacity .2s, transform .2s;
  box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .45);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
body.has-mbar #toast { bottom: 96px; }
@media (min-width: 1024px) { body.has-mbar #toast { bottom: 1.5rem; } }

/* ---------- Footer ---------- */
.site-footer { margin-top: 5rem; padding: 3rem 0 2rem; background: var(--night); color: rgba(240, 231, 216, .8); }
.footer-grid { display: grid; gap: 2rem; }
@media (min-width: 720px) { .footer-grid { grid-template-columns: 1.5fr 1fr 1fr; } }
.footer-brand img { width: 72px; height: 72px; border-radius: 50%; margin-bottom: 1rem; }
.footer-name { font: 400 1.5rem/1.2 var(--serif); color: var(--cream); margin-bottom: .25rem; }
.footer-h { font-size: .875rem; font-weight: 600; color: var(--cream); margin-bottom: .75rem; }
.site-footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.site-footer a { color: inherit; text-decoration: none; }
.site-footer a:hover { color: var(--cream); text-decoration: underline; }
.footer-bottom {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem;
  margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid rgba(240, 231, 216, .12); font-size: .875rem;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-delay: 0s !important;
    animation-iteration-count: 1 !important; transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- Short laptop screens: keep sticky panels fully visible ---------- */
@media (min-width: 1024px) and (max-height: 820px) {
  .summary { padding: 1.125rem 1.25rem; }
  .sc-title { margin-bottom: .375rem; }
  .sc-price { margin-bottom: .625rem; }
  .sc-amount { font-size: 1.875rem; }
  .sc-rows > div { padding: .5rem .75rem; }
  .sc-total { margin-top: .75rem; }
  .sc-tax { margin-bottom: .625rem; }
  .summary .btn { min-height: 42px; }
  .summary .btn-quiet { margin-top: .5rem; }
  .sc-note { display: none; }
  .sc-lines { margin-top: .625rem; gap: .25rem; }
}
@media (min-width: 1024px) and (max-height: 600px) { .stay-aside { position: static; } }
@media (min-width: 1024px) and (max-height: 760px) { .support-aside { position: static; } }

/* receipt-style price lines in the final preview */
.pv-money > div { display: flex; justify-content: space-between; gap: 1rem; }
.pv-money dd { text-align: right; white-space: nowrap; }

/* phones: bars plus one caption instead of four squeezed labels */
.stepper-caption { display: none; }
@media (max-width: 559px) {
  .stepper { margin-bottom: .625rem; }
  .step > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .stepper-caption { display: block; margin: 0 0 1.5rem; font-size: .875rem; font-weight: 600; }
}
.contact-hours { display: flex; align-items: center; gap: .5rem; margin: 0 0 1rem; font-size: .875rem; color: var(--muted); }

/* ---------- Per-guest prices + extra bedding ---------- */
.slot-per { display: block; font-size: .75rem; color: var(--muted); }
.guests-hint { line-height: 1.45; }
.bedding {
  margin-top: .625rem; padding: .875rem 1rem 1rem;
  border: 1px dashed var(--gold); border-radius: 14px; background: #FBF6EC;
  animation: fadein .25s ease-out;
}
.bedding-title { display: flex; align-items: center; gap: .5rem; margin: 0; font-weight: 600; }
.bedding-title svg { color: var(--gold-ink); }
.bedding-sub { margin: .25rem 0 0; font-size: .875rem; color: var(--muted); }
.bedding .check { align-items: center; margin-top: .625rem; }
.bed-label { flex: 1; }
.bed-price { font-size: .875rem; font-weight: 600; color: var(--gold-ink); }

/* ---------- Cake ---------- */
.cake { margin-top: 1.5rem; }
.cake-toggle {
  display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: .875rem;
  padding: .875rem 1rem; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); cursor: pointer;
}
.cake-toggle:hover { border-color: var(--ink-2); }
.cake-toggle input { margin: 0; }
.cake-toggle.is-on { border-color: var(--night); box-shadow: inset 0 0 0 1px var(--night); background: #FCF9F3; }
.cake-toggle.is-blocked { cursor: not-allowed; background: transparent; }
.cake-toggle.is-blocked > span { opacity: .55; }
.cake-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-ink); }
.cake-toggle.is-on .cake-icon { background: var(--night); color: var(--gold-light); }
.cake-title { display: block; font-weight: 600; }
.cake-sub { display: block; font-size: .875rem; color: var(--muted); }
.cake-price { font-weight: 600; color: var(--gold-ink); white-space: nowrap; }
.cake-note { display: flex; gap: .5rem; align-items: flex-start; margin: .625rem 0 0; font-size: .875rem; color: #7E4A1C; }
.cake-note svg { flex-shrink: 0; margin-top: 2px; }
.cake-fields { margin-top: .875rem; }
.cake-fields .check { margin-top: 0; }
@media (max-width: 480px) {
  .cake-toggle { grid-template-columns: auto minmax(0, 1fr) auto; }
  .cake-icon { display: none; }
}

/* ---------- Price lines ---------- */
.sc-lines { display: grid; gap: .375rem; margin-top: 1rem; }
.sc-lines > div { display: flex; justify-content: space-between; gap: 1rem; font-size: .9375rem; }
.sc-lines dt { color: var(--ink-2); }
.sc-lines dd { font-weight: 500; white-space: nowrap; }
.sc-lines + .sc-total { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--line); }
.b-sub, .pv-sub { display: block; font-size: .8125rem; font-weight: 400; color: var(--muted); }
.more-h { font-weight: 600; margin: .75rem 0 .25rem; color: var(--ink); }
.tc-cake {
  display: inline-flex; align-items: center; gap: .5rem; margin: 0 0 1.25rem; padding: .5rem .75rem;
  border-radius: 10px; background: var(--gold-soft); color: #5E3E17; font-size: .875rem;
}

/* ---------- Buy me a coffee ---------- */
.coffee-wrap { margin-top: 4rem; }
.coffee {
  display: grid; gap: 1.5rem 3rem; align-items: center;
  padding: clamp(1.5rem, 4vw, 3rem); border-radius: 28px;
  background: var(--paper); border: 1px solid var(--line);
}
.coffee-art { width: 150px; }
@media (min-width: 860px) {
  .coffee { grid-template-columns: 220px minmax(0, 1fr); }
  .coffee-art { width: 220px; }
}
.coffee-lead { color: var(--ink-2); max-width: 58ch; }
.cups { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 1.25rem 0; }
.cups-each { display: inline-flex; align-items: center; gap: .5rem; margin-right: .5rem; color: var(--muted); font-size: .9375rem; }
.cups-each svg { color: var(--gold-ink); }
.cup-opt {
  width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--cream);
  color: var(--ink); font-weight: 600; font-size: 1.0625rem; cursor: pointer;
}
.cup-opt:hover { border-color: var(--ink-2); }
.cup-opt.is-selected { background: var(--night); border-color: var(--night); color: var(--paper); }
.cup-custom input { width: 96px; height: 48px; padding: 0 .75rem; border-radius: 999px; text-align: center; }
.coffee-fields { margin-bottom: 1.25rem; }
.coffee-actions { display: flex; flex-wrap: wrap; gap: .75rem; }
.coffee-upi { margin: 1rem 0 0; font-size: .9375rem; color: var(--ink-2); }
.coffee-upi .link-btn { margin-left: .75rem; }
.coffee-pay-sum { font-size: 1.0625rem; margin-bottom: 1rem; }
.pay-methods.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 360px; }

const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => CONFIG.currency + Math.round(n).toLocaleString(CONFIG.locale);
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const pad2 = n => String(n).padStart(2, '0');
const toKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const fmtMed = k => { const d = fromKey(k); return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtLong = k => { const d = fromKey(k); return `${DOW_LONG[d.getDay()]}, ${d.getDate()} ${MON_LONG[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = k => { const d = fromKey(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtTime = d => { const h = d.getHours(); return `${h % 12 || 12}:${pad2(d.getMinutes())} ${h >= 12 ? 'PM' : 'AM'}`; };
const fmtDateTime = d => `${d.getDate()} ${MON[d.getMonth()]}, ${fmtTime(d)}`;
const getSlot = id => CONFIG.slots.find(s => s.id === id) || null;
const getTheme = id => CONFIG.themes.find(t => t.id === id) || null;
const minPrice = () => Math.min(...CONFIG.slots.map(s => s.price));

/* ---------- data + persistence ---------- */
const STORAGE_KEY = 'themoon-data-v1';
const hasStorage = () => typeof window.storage === 'object' && window.storage !== null && typeof window.storage.get === 'function';
const freshCake = () => ({ on: false, flavour: CONFIG.cake.flavours[0], eggless: false, message: '' });
const freshBedding = () => ({ pillows: false, mattress: false });
const freshDraft = () => ({ date: null, slot: null, guests: 2, themeId: null, note: '', cake: freshCake(), bedding: freshBedding() });
function normalizeSel(sel) {
  const out = Object.assign(freshDraft(), sel || {});
  out.cake = Object.assign(freshCake(), (sel && sel.cake) || {});
  out.bedding = Object.assign(freshBedding(), (sel && sel.bedding) || {});
  out.note = String(out.note || '');
  return out;
}
const data = { bookings: [], wishlist: [], coffees: [], draft: freshDraft(), guest: { name: '', phone: '', email: '' } };
let saveTimer = null;

function persist() {
  if (!hasStorage()) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(data), false); }
    catch (err) { console.warn('Could not save data', err); }
  }, 250);
}

async function restore() {
  if (!hasStorage()) return false;
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    if (!res || !res.value) return false;
    const saved = JSON.parse(res.value);
    if (Array.isArray(saved.bookings)) data.bookings = saved.bookings;
    if (Array.isArray(saved.wishlist)) data.wishlist = saved.wishlist.map(w => ({ ...w, sel: normalizeSel(w.sel) }));
    if (Array.isArray(saved.coffees)) data.coffees = saved.coffees;
    if (saved.draft) data.draft = normalizeSel(saved.draft);
    if (saved.guest) Object.assign(data.guest, saved.guest);
    sanitizeDraft();
    return true;
  } catch (err) {
    return false; // nothing saved yet
  }
}

function sanitizeDraft() {
  const d = data.draft;
  d.guests = Math.min(CONFIG.stay.maxGuests, Math.max(1, Number(d.guests) || 1));
  if (d.date && !isBookableDate(d.date)) d.date = null;
  if (d.slot && !getSlot(d.slot)) d.slot = null;
  if (d.date && d.slot && !isSlotAvailable(d.date, d.slot)) d.slot = null;
  const t = getTheme(d.themeId);
  if (!t || (d.slot && !t.slots.includes(d.slot))) d.themeId = null;
  if (!beddingOffered(d.guests)) d.bedding = freshBedding();
  if (!CONFIG.cake.flavours.includes(d.cake.flavour)) d.cake.flavour = CONFIG.cake.flavours[0];
  if (isCakeOn(d) && !cakeNoticeOk(d)) d.cake.on = false;
}

/* ---------- availability ---------- */
const windowEnd = () => addDays(today(), CONFIG.bookingWindowDays);
const isBookableDate = key => { const d = fromKey(key); return d >= today() && d <= windowEnd(); };

function demoTaken(key) {
  // Deterministic sample bookings so the calendar looks lived-in. Replace with real data.
  let h = 2166136261;
  for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
  const r1 = ((h >>> 0) % 1000) / 1000;
  h = Math.imul(h ^ (h >>> 13), 0x5bd1e995);
  const r2 = ((h >>> 0) % 1000) / 1000;
  const dow = fromKey(key).getDay();
  const p = (dow === 0 || dow === 5 || dow === 6) ? 0.36 : 0.15;
  return { am: r1 < p, pm: r2 < p };
}

function takenFor(key) {
  const t = CONFIG.demoAvailability ? demoTaken(key) : { am: false, pm: false };
  for (const b of data.bookings) {
    if (b.status !== 'confirmed' || b.date !== key) continue;
    if (b.slot === 'full') { t.am = true; t.pm = true; } else t[b.slot] = true;
  }
  return t;
}
function isSlotAvailable(key, slotId) {
  const t = takenFor(key);
  return slotId === 'full' ? !t.am && !t.pm : !t[slotId];
}
function dayPhase(key) {
  const t = takenFor(key);
  const free = (t.am ? 0 : 1) + (t.pm ? 0 : 1);
  return free === 2 ? 'full' : free === 1 ? 'half' : 'none';
}
function slotStartDate(key, slotId) {
  const d = fromKey(key);
  const [h, m] = (getSlot(slotId)?.start || '09:00').split(':').map(Number);
  d.setHours(h, m, 0, 0);
  return d;
}

/* ---------- pricing, extras + validity ---------- */
const isCakeOn = sel => !!(sel.cake && sel.cake.on);
const slotPriceFor = (slot, guests) => slot.price + Math.max(0, guests - CONFIG.stay.includedGuests) * slot.extraGuest;
const beddingOffered = guests => guests > CONFIG.stay.bedSleeps;
const mattressCount = sel => Math.max(0, sel.guests - CONFIG.stay.bedSleeps);
const cakeSummary = c => [c.flavour, c.eggless ? 'eggless' : ''].filter(Boolean).join(', ');
const cakeRemovedMsg = () => `Cakes need ${CONFIG.cake.noticeHours} hours’ notice, so the cake was removed.`;

function cakeNoticeOk(sel) {
  if (!sel.date || !sel.slot) return true;   // can't tell yet; checked again once both are chosen
  return slotStartDate(sel.date, sel.slot).getTime() - Date.now() >= CONFIG.cake.noticeHours * 36e5;
}
function beddingItems(sel) {
  const b = sel.bedding || {}, B = CONFIG.bedding, items = [];
  if (!beddingOffered(sel.guests)) return items;
  if (b.pillows) items.push({ label: B.pillows.label, cost: B.pillows.price });
  if (b.mattress) {
    const n = mattressCount(sel);
    items.push({ label: `${B.mattress.label} ×${n}`, cost: B.mattress.price * n });
  }
  return items;
}
function priceFor(sel) {
  const slot = getSlot(sel.slot), theme = getTheme(sel.themeId);
  const base = slot ? slot.price : 0;
  const extraCount = slot ? Math.max(0, sel.guests - CONFIG.stay.includedGuests) : 0;
  const extraGuests = slot ? extraCount * slot.extraGuest : 0;
  const add = theme ? theme.price : 0;
  const cake = isCakeOn(sel) ? CONFIG.cake.price : 0;
  const bedding = beddingItems(sel).reduce((sum, x) => sum + x.cost, 0);
  const subtotal = base + extraGuests + add + cake + bedding;
  const tax = Math.round(subtotal * CONFIG.taxRate);
  return { base, extraCount, extraGuests, add, cake, bedding, tax, total: subtotal + tax };
}
function priceLines(sel) {
  const slot = getSlot(sel.slot), theme = getTheme(sel.themeId), p = priceFor(sel);
  if (!slot) return [];
  const lines = [[slot.label, p.base]];
  if (p.extraCount) lines.push([`+${plural(p.extraCount, 'guest')}`, p.extraGuests]);
  if (theme) lines.push([theme.name, p.add]);
  if (isCakeOn(sel)) lines.push(['Cake', p.cake]);
  if (beddingItems(sel).length) lines.push(['Extra bedding', p.bedding]);
  if (p.tax) lines.push(['Taxes', p.tax]);
  return lines;
}
const cheapestTotal = sel => Math.min(...CONFIG.slots.map(s => priceFor({ ...sel, slot: s.id }).total));

function draftIssues(d = data.draft) {
  const issues = [];
  if (!d.date || !isBookableDate(d.date)) issues.push('date');
  if (!d.slot) issues.push('slot');
  if (d.date && d.slot && isBookableDate(d.date) && !isSlotAvailable(d.date, d.slot)) issues.push('taken');
  const t = getTheme(d.themeId);
  if (t && d.slot && !t.slots.includes(d.slot)) issues.push('theme');
  if (isCakeOn(d) && !cakeNoticeOk(d)) issues.push('cake');
  if (d.guests < 1 || d.guests > CONFIG.stay.maxGuests) issues.push('guests');
  return issues;
}
const draftReady = () => draftIssues().length === 0;
function hintText() {
  const i = draftIssues();
  if (i.includes('date') && i.includes('slot')) return 'Choose a date and a slot to continue.';
  if (i.includes('date')) return 'Choose a date to continue.';
  if (i.includes('slot')) return 'Choose a slot to continue.';
  if (i.includes('taken')) return 'That slot was just booked. Choose another one.';
  if (i.includes('theme')) return 'Your theme isn’t available for this slot.';
  if (i.includes('cake')) return `Cakes need ${CONFIG.cake.noticeHours} hours’ notice. Remove the cake or choose a later slot.`;
  if (i.includes('guests')) return `Bookings are for up to ${CONFIG.stay.maxGuests} guests.`;
  return '';
}

/* cancellation policy, generated from CONFIG.cancellation so every page says the same thing */
const TIERS = () => [...CONFIG.cancellation].sort((a, b) => b.hoursBefore - a.hoursBefore);
function chargePercent(hoursBefore) {
  if (hoursBefore <= 0) return CONFIG.noShowCharge;
  const tier = TIERS().find(t => hoursBefore >= t.hoursBefore);
  return tier ? tier.charge : CONFIG.noShowCharge;
}
const freeCancelHours = () => { const t = TIERS().find(x => x.charge === 0); return t ? t.hoursBefore : null; };
const cancellationShort = () => { const h = freeCancelHours(); return h == null ? '' : `Free cancellation up to ${h} hours before check-in.`; };
function policyItems() {
  const tiers = TIERS();
  const items = tiers.map((t, i) => {
    const prev = tiers[i - 1];
    const when = !prev ? `${t.hoursBefore} hours or more before check-in`
      : t.hoursBefore === 0 ? `Less than ${prev.hoursBefore} hours before check-in`
      : `Between ${t.hoursBefore} and ${prev.hoursBefore} hours before check-in`;
    return `${when}: ${t.charge === 0 ? 'no charge' : `${t.charge}% of the booking cost is charged`}.`;
  });
  items.push(CONFIG.noShowCharge >= 100 ? 'No-shows are charged in full.' : `No-shows are charged ${CONFIG.noShowCharge}%.`);
  items.push('If we can’t arrange a theme or cake you booked, its price is refunded in full.');
  return items;
}
function cancellationLine(sel) {
  const start = slotStartDate(sel.date, sel.slot).getTime(), now = Date.now();
  const steps = TIERS().map(t => ({ charge: t.charge, end: start - t.hoursBefore * 36e5 })).filter(s => s.end > now);
  if (!steps.length) return 'Your slot has started, so cancelling now is not refunded.';
  return steps.map((s, i) => {
    const until = s.end === start ? '' : fmtDateTime(new Date(s.end));
    if (i === 0) {
      if (!until) return `Check-in is close, so cancelling now has a ${s.charge}% charge.`;
      return s.charge === 0 ? `Free cancellation until ${until}.` : `Cancelling now has a ${s.charge}% charge until ${until}.`;
    }
    return until ? `Then a ${s.charge}% charge applies until ${until}.` : `After that, the charge is ${s.charge}%.`;
  }).join(' ');
}
function refundFor(b) {
  const hours = (slotStartDate(b.date, b.slot).getTime() - Date.now()) / 36e5;
  const charge = chargePercent(hours);
  const charged = Math.round(b.amount * charge / 100);
  const amount = b.amount - charged;
  let text;
  if (hours <= 0) text = 'Your slot has already started, so no refund applies.';
  else if (charge === 0) text = `It’s free to cancel now. You’ll get a full refund of ${money(amount)}.`;
  else {
    const tiers = TIERS(), i = tiers.findIndex(t => hours >= t.hoursBefore);
    const within = i > 0 ? tiers[i - 1].hoursBefore : null;
    const lead = within ? `Check-in is less than ${within} hours away, so ` : '';
    text = amount > 0
      ? `${lead}${charge}% (${money(charged)}) is charged and ${money(amount)} is refunded.`
      : `${lead}the full ${money(charged)} is charged.`;
    text = text.charAt(0).toUpperCase() + text.slice(1);
  }
  return { amount, charge, charged, text };
}

  const parts = path.split('/').filter(Boolean);

}

function calendarHTML() {
  const m = ui.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const days = new Date(y, mo + 1, 0).getDate();
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7;
  const t0 = today(), end = windowEnd();
  const canPrev = m > startOfMonth(t0);
  const canNext = new Date(y, mo + 1, 1) <= end;
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span aria-hidden="true"></span>';
  for (let d = 1; d <= days; d++) {
    const date = new Date(y, mo, d), key = toKey(date);
    const inRange = date >= t0 && date <= end;
    const phase = inRange ? dayPhase(key) : null;
    const selected = data.draft.date === key;
    const cls = ['cal-day', selected && 'is-selected', date.getTime() === t0.getTime() && 'is-today'].filter(Boolean).join(' ');
    const state = !inRange ? 'not bookable' : phase === 'full' ? 'all slots open' : phase === 'half' ? 'one half-day left' : 'fully booked';
    cells += `<button type="button" class="${cls}" data-action="pick-date" data-date="${key}" aria-pressed="${selected}" aria-label="${DOW_LONG[date.getDay()]} ${d} ${MON_LONG[mo]}, ${state}"${!inRange || phase === 'none' ? ' disabled' : ''}><span class="d-num">${d}</span><span class="d-phase${phase ? ' phase-' + phase : ''}" aria-hidden="true"></span></button>`;
  }
  return `<div class="cal-head">
      <button type="button" class="icon-btn" data-action="cal-prev" aria-label="Previous month"${canPrev ? '' : ' disabled'}>${icon('chevron-left', 20)}</button>
      <h3 class="cal-title" aria-live="polite">${MON_LONG[mo]} ${y}</h3>
      <button type="button" class="icon-btn" data-action="cal-next" aria-label="Next month"${canNext ? '' : ' disabled'}>${icon('chevron-right', 20)}</button>
    </div>
    <div class="cal-grid">${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(x => `<span class="cal-dow" aria-hidden="true">${x}</span>`).join('')}${cells}</div>
    <ul class="cal-legend">
      <li><span class="d-phase phase-full"></span>All slots open</li>
      <li><span class="d-phase phase-half"></span>One half-day left</li>
      <li><span class="d-phase phase-none"></span>Fully booked</li>
    </ul>`;
}

function slotsHTML() {
  const d = data.draft;
  const cards = CONFIG.slots.map(s => {
    const free = !d.date || isSlotAvailable(d.date, s.id);
    const selected = d.slot === s.id;
    return `<button type="button" class="slot${selected ? ' is-selected' : ''}" data-action="pick-slot" data-slot="${s.id}" aria-pressed="${selected}"${free ? '' : ' disabled'}>
      <span class="slot-icon">${icon(s.icon, 20)}</span>
      <span class="slot-text"><span class="slot-name">${esc(s.label)}</span><span class="slot-time">${esc(s.time)}</span></span>
      <span class="slot-end"><span class="slot-price">${money(slotPriceFor(s, d.guests))}</span>${free ? `<span class="slot-per">for ${plural(d.guests, 'guest')}</span>` : '<span class="slot-status">Booked</span>'}</span>
    </button>`;
  }).join('');
  return cards + (d.date
    ? `<p class="slots-hint">Showing availability for ${esc(fmtMed(d.date))}.</p>`
    : '<p class="slots-hint">Pick a date to see which slots are free.</p>');
}

function guestsHTML() {
  const d = data.draft, g = d.guests, S = CONFIG.stay, max = S.maxGuests, B = CONFIG.bedding;
  const slot = getSlot(d.slot);
  const rates = CONFIG.slots.map(s => s.extraGuest), lo = Math.min(...rates), hi = Math.max(...rates);
  const rate = slot ? money(slot.extraGuest) : lo === hi ? money(lo) : `${money(lo)}–${money(hi)}`;
  const who = S.includedGuests === 1 ? 'Each guest after the first' : `Price includes ${numWord(S.includedGuests)} guests. Each extra guest`;
  const n = mattressCount(d);
  const bedding = beddingOffered(g) ? `<div class="bedding">
      <p class="bedding-title">${icon('bed', 18)}Extra bedding for ${plural(g, 'guest')}</p>
      <p class="bedding-sub">The bed sleeps ${numWord(S.bedSleeps)}. Ask for more and we’ll set it up before you arrive.</p>
      <label class="check"><input type="checkbox" data-bed="pillows"${d.bedding.pillows ? ' checked' : ''}><span class="bed-label">${esc(B.pillows.label)}</span><span class="bed-price">${amountText(B.pillows.price)}</span></label>
      <label class="check"><input type="checkbox" data-bed="mattress"${d.bedding.mattress ? ' checked' : ''}><span class="bed-label">${esc(B.mattress.label)} ×${n}</span><span class="bed-price">${amountText(B.mattress.price * n)}</span></label>
    </div>` : '';
  return `<div class="guests">
      <div><span class="guests-label">Guests</span><span class="guests-hint">${g >= max ? `${max} is the most we can host` : `Up to ${max}`}</span><span class="guests-hint">${who} adds ${rate}.</span></div>
      <div class="stepper-ctl">
        <button type="button" class="icon-btn icon-btn-line" data-action="guests" data-delta="-1" aria-label="Remove a guest"${g <= 1 ? ' disabled' : ''}>${icon('minus', 18)}</button>
        <output aria-live="polite">${g}</output>
        <button type="button" class="icon-btn icon-btn-line" data-action="guests" data-delta="1" aria-label="Add a guest"${g >= max ? ' disabled' : ''}>${icon('plus', 18)}</button>
      </div>
    </div>${bedding}`;
}

    const selected = d.themeId === t.id;

// Restore focus after a re-render only for keyboard users, so mouse and touch
// users don't see a focus ring linger on the button they just clicked.
let keyboardNav = false;
document.addEventListener('keydown', e => { if (!e.metaKey && !e.ctrlKey) keyboardNav = true; }, true);
document.addEventListener('pointerdown', () => { keyboardNav = false; }, true);
function refocus(selector) {
  if (!keyboardNav) return false;
  const el = document.querySelector(selector);
  if (el && !el.disabled) { el.focus({ preventScroll: true }); return true; }
  return false;
}

function emptyHTML(title, text, cta, target) {
  return `<div class="empty"><div class="empty-moon" aria-hidden="true"></div><h2>${esc(title)}</h2><p>${esc(text)}</p><button type="button" class="btn btn-primary" data-action="scroll" data-target="${target}">${esc(cta)}</button></div>`;
}

function bookingsListHTML() {
  if (!data.bookings.length) return emptyHTML('No bookings yet', 'Pick a date and a slot on the home page. Once you pay, your stay shows up here.', 'Check availability', 'book');
  const t0 = today();
  const upcoming = data.bookings.filter(b => b.status === 'confirmed' && fromKey(b.date) >= t0).sort((a, b) => a.date.localeCompare(b.date) || a.slot.localeCompare(b.slot));
  const past = data.bookings.filter(b => !upcoming.includes(b)).sort((a, b) => b.date.localeCompare(a.date));
  let html = '';
  if (upcoming.length) html += `<h2 class="list-h">Upcoming</h2><div class="bk-list">${upcoming.map(bookingCard).join('')}</div>`;
  else html += `<div class="empty" style="margin-bottom:2.5rem"><div class="empty-moon" aria-hidden="true"></div><h2>No upcoming stays</h2><p>Your next calm day is a few taps away.</p><button type="button" class="btn btn-primary" data-action="scroll" data-target="book">Check availability</button></div>`;
  if (past.length) html += `<h2 class="list-h">Past and cancelled</h2><div class="bk-list">${past.map(bookingCard).join('')}</div>`;
  return html;
}

function bookingCard(b) {
  const d = fromKey(b.date), s = getSlot(b.slot), t = getTheme(b.themeId);
  const cancelled = b.status === 'cancelled';
  const isPast = d < today();
  const isNew = ui.highlightBooking === b.id;
  const bedding = Array.isArray(b.bedding) ? b.bedding : [];
  const chip = cancelled ? '<span class="chip chip-muted">Cancelled</span>' : isPast ? '<span class="chip chip-muted">Completed</span>' : '<span class="chip chip-ok">Confirmed</span>';
  return `<article class="booking${cancelled ? ' is-cancelled' : ''}${isNew ? ' is-new' : ''}">
    <div class="b-date" aria-hidden="true"><span class="b-dow">${DOW[d.getDay()]}</span><span class="b-day">${d.getDate()}</span><span class="b-mon">${MON[d.getMonth()]} ${d.getFullYear()}</span></div>
    <div>
      <div class="b-top"><h3>${esc(s ? s.label : b.slot)}<span class="sr-only">, ${esc(fmtLong(b.date))}</span></h3>${isNew ? '<span class="chip chip-gold">Just booked</span>' : ''}${chip}</div>
      <p class="b-time">${esc(s ? s.time : '')}</p>
      <dl class="b-meta">
        <div><dt>Booking ID</dt><dd>${esc(b.id)}</dd></div>
        <div><dt>Guests</dt><dd>${b.guests}</dd></div>
        <div><dt>Theme</dt><dd>${t ? esc(t.name) : 'None'}</dd></div>
        ${b.cake ? `<div><dt>Cake</dt><dd>${esc(cakeSummary(b.cake))}</dd></div>` : ''}
        ${bedding.length ? `<div><dt>Extra bedding</dt><dd>${esc(bedding.join(', '))}</dd></div>` : ''}
        <div><dt>${cancelled ? 'Refund' : 'Paid'}</dt><dd>${cancelled ? `${money(b.refund || 0)}${b.charge ? `<span class="b-sub">${b.charge}% charged</span>` : ''}` : `${money(b.amount)} by ${esc(b.method)}`}</dd></div>
      </dl>
      ${b.cake && b.cake.message ? `<p class="b-note">${icon('cake', 16)}<span>On the cake: “${esc(b.cake.message)}”</span></p>` : ''}
      ${b.note ? `<p class="b-note">${icon('message', 16)}<span>${esc(b.note)}</span></p>` : ''}
      ${!cancelled && !isPast ? `<div class="b-actions">
        <a class="btn btn-quiet btn-sm" href="#/support?booking=${encodeURIComponent(b.id)}">Get help</a>
        <button type="button" class="btn btn-quiet btn-sm btn-danger-text" data-action="cancel-booking" data-id="${esc(b.id)}">Cancel booking</button>
      </div>` : ''}
    </div>
  </article>`;
}

function wishStatus(sel) {
  if (!sel.date) return { ok: false, text: 'No date yet. Pick one when you book.' };
  if (!isBookableDate(sel.date)) return { ok: false, text: 'This date has passed. Pick a new one when you book.' };
  if (sel.slot && !isSlotAvailable(sel.date, sel.slot)) return { ok: false, text: 'This slot has been booked. Pick another date or slot.' };
  if (!sel.slot) return dayPhase(sel.date) === 'none' ? { ok: false, text: 'This date is fully booked now.' } : { ok: false, text: 'Date is open. Pick a slot when you book.' };
  if (isCakeOn(sel) && !cakeNoticeOk(sel)) return { ok: false, text: 'It’s too close to check-in for a cake now. Booking this will leave the cake out.' };
  return { ok: true, text: 'Still available' };
}

function wishlistHTML() {
  if (!data.wishlist.length) return emptyHTML('Your wishlist is empty', 'Shape a stay you like (a date, a slot, a theme) and tap Save to wishlist. It waits here until you’re ready.', 'Start planning', 'book');
  return `<div class="wish-list">${data.wishlist.map(w => {
    const sel = w.sel, s = getSlot(sel.slot), t = getTheme(sel.themeId), st = wishStatus(sel), bed = beddingItems(sel);
    return `<article class="wish">
      <div class="w-head">
        <label class="w-name-wrap"><span class="sr-only">Name of this plan</span><input class="w-name" data-id="${w.id}" value="${esc(w.name)}" maxlength="60">${icon('pencil', 16)}</label>
        <span class="w-saved">Saved ${esc(fmtShort(toKey(new Date(w.savedAt))))}</span>
      </div>
      <dl class="w-meta">
        <div><dt>Date</dt><dd>${sel.date ? esc(fmtMed(sel.date)) : 'Not chosen'}</dd></div>
        <div><dt>Slot</dt><dd>${s ? esc(s.label) : 'Not chosen'}</dd></div>
        <div><dt>Guests</dt><dd>${sel.guests}</dd></div>
        <div><dt>Theme</dt><dd>${t ? esc(t.name) : 'None'}</dd></div>
        ${isCakeOn(sel) ? `<div><dt>Cake</dt><dd>${esc(cakeSummary(sel.cake))}</dd></div>` : ''}
        ${bed.length ? `<div><dt>Extra bedding</dt><dd>${esc(bed.map(x => x.label).join(', '))}</dd></div>` : ''}
        <div><dt>Estimated total</dt><dd>${s ? money(priceFor(sel).total) : `From ${money(cheapestTotal(sel))}`}</dd></div>
      </dl>
      ${sel.note ? `<p class="b-note">${icon('message', 16)}<span>${esc(sel.note)}</span></p>` : ''}
      <p class="w-status ${st.ok ? 'is-ok' : 'is-warn'}">${icon(st.ok ? 'check' : 'info', 16)}${esc(st.text)}</p>
      <div class="w-actions">
        <button type="button" class="btn btn-primary btn-sm" data-action="wish-book" data-id="${w.id}">Book this</button>
        <button type="button" class="btn btn-quiet btn-sm" data-action="wish-remove" data-id="${w.id}">Remove</button>
      </div>
    </article>`;
  }).join('')}</div>`;
}

function defaultWishName(sel) {
  const t = getTheme(sel.themeId), s = getSlot(sel.slot);
  const what = t ? t.name : s ? s.label : 'My stay';
  return sel.date ? `${what}, ${fmtShort(sel.date)}` : what;
}
function saveWish() {
  const d = data.draft;
  if (!d.date && !d.slot && !d.themeId && !isCakeOn(d)) { toast('Choose a date, slot or theme first, then save it.'); return; }
  const sig = x => JSON.stringify([x.date, x.slot, x.guests, x.themeId, (x.note || '').trim(),
    isCakeOn(x) ? [x.cake.flavour, x.cake.eggless, x.cake.message.trim()] : null, beddingItems(x).map(i => i.label)]);
  if (data.wishlist.some(w => sig(w.sel) === sig(d))) { toast('Already in your wishlist'); return; }
  data.wishlist.unshift({ id: uid(), name: defaultWishName(d), savedAt: Date.now(), sel: normalizeSel({ ...d, note: d.note.trim() }) });
  persist();
  updateHeader(parseHash().name);
  toast('Saved to wishlist');
}

}
function faqAnswer(f) {

  if (f.a === 'slots') {
    const [full, am, pm] = [getSlot('full'), getSlot('am'), getSlot('pm')];
    if (!full || !am || !pm) return 'See the slot options on the home page for times and prices.';
    return `A full day runs ${full.time}. A half day is either a morning (${am.time}) or an evening (${pm.time}). We reset the room in between.`;
  }
  if (f.a === 'guests') {
    const half = getSlot('am') || CONFIG.slots[0], full = getSlot('full') || CONFIG.slots[0];
    const inc = S.includedGuests;
    return `The slot price covers ${numWord(inc)} ${inc === 1 ? 'guest' : 'guests'}. Each extra guest adds ${money(half.extraGuest)} to a half day or ${money(full.extraGuest)} to a full day, up to ${S.maxGuests} guests in total. With ${S.bedSleeps + 1} or more guests, you can ask for extra pillows and floor mattresses.`;

function validateGuest() {
  const g = data.guest, e = {};
  if (g.name.trim().length < 2) e.name = 'Enter your full name.';
  if (g.phone.replace(/\D/g, '').length < 10) e.phone = 'Enter a phone number with at least 10 digits.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(g.email.trim())) e.email = 'Enter an email like name@example.com.';
  if (!checkout.agree.privacy || !checkout.agree.rules) e.agree = 'Tick both agreements to continue.';
  checkout.errors = e;
  return Object.keys(e).length === 0;
}
function validatePay() {
  const m = checkout.method, p = checkout.pay, e = {};
  if (m === 'upi' && !/^[\w.\-]{2,}@[a-zA-Z][\w.\-]*$/.test(p.upi.trim())) e.upi = 'Enter a UPI ID like yourname@bank.';
  if (m === 'card') {
    const digits = p.card.replace(/\D/g, '');
    if (digits.length < 12 || digits.length > 19) e.card = 'Enter the full card number.';
    const mm = /^(\d{2})\/(\d{2})$/.exec(p.exp);
    const now = new Date();
    const expired = mm && (2000 + +mm[2] < now.getFullYear() || (2000 + +mm[2] === now.getFullYear() && +mm[1] < now.getMonth() + 1));
    if (!mm || +mm[1] < 1 || +mm[1] > 12 || expired) e.exp = 'Enter a valid expiry date (MM/YY).';
    if (!/^\d{3,4}$/.test(p.cvc)) e.cvc = 'Enter the 3 or 4 digit CVV.';
    if (p.cardName.trim().length < 2) e.cardName = 'Enter the name on the card.';
  }
  if (m === 'netbanking' && !p.bank) e.bank = 'Choose your bank.';
  checkout.errors = e;
  return Object.keys(e).length === 0;
}
function payLabel() {
  if (checkout.method === 'upi') return 'UPI';
  if (checkout.method === 'card') return `card ending ${checkout.pay.card.replace(/\D/g, '').slice(-4)}`;
  return `net banking (${checkout.pay.bank})`;
}
function createBooking() {
  const d = data.draft, p = priceFor(d);
  const [y, m, day] = d.date.split('-');
  let id;
  do { id = `TM-${y.slice(2)}${m}${day}-${Math.floor(1000 + Math.random() * 9000)}`; } while (data.bookings.some(b => b.id === id));
  const booking = {
    id, createdAt: Date.now(), date: d.date, slot: d.slot, guests: d.guests, themeId: d.themeId,
    note: d.note.trim(), guest: { ...data.guest }, amount: p.total, lines: priceLines(d),
    bedding: beddingItems(d).map(x => x.label),
    cake: isCakeOn(d) ? { flavour: d.cake.flavour, eggless: d.cake.eggless, message: d.cake.message.trim() } : null,
    method: payLabel(), status: 'confirmed',
  };
  data.bookings.unshift(booking);
  data.draft = freshDraft();
  persist();
  return booking;
}

function confirmDialog({ title, body, confirm, cancel, danger }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    overlayRoot.innerHTML = `<div class="modal-backdrop" data-modal-backdrop>
      <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-body">
        <h2 id="m-title">${esc(title)}</h2><p id="m-body">${esc(body)}</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-quiet" data-modal-btn="0">${esc(cancel)}</button>
          <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-modal-btn="1">${esc(confirm)}</button>
        </div>
      </div>
    </div>`;
    document.body.classList.add('no-scroll');
    const done = value => {
      overlayRoot.innerHTML = '';
      overlayRoot.onclick = null;
      modalResolve = null;
      document.body.classList.remove('no-scroll');
      if (prev && document.contains(prev)) prev.focus();
      resolve(value);
    };
    modalResolve = done;
    overlayRoot.onclick = e => {
      const btn = e.target.closest('[data-modal-btn]');
      if (btn) done(btn.dataset.modalBtn === '1');
      else if (e.target.hasAttribute('data-modal-backdrop')) done(false);
    };
    $('[data-modal-btn="0"]').focus();
  });
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function trapFocus(e) {
  const root = overlayRoot.firstElementChild;
  if (!root) return;
  const items = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', root).filter(el => !el.disabled);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ---------- actions ---------- */
const actions = {

  },
  'pick-date': el => {
    const key = el.dataset.date, d = data.draft;
    d.date = key;

    if (d.slot && !isSlotAvailable(key, d.slot)) { notes.push(`${getSlot(d.slot).label} is booked on ${fmtShort(key)}. Pick another slot.`); d.slot = null; }
    if (isCakeOn(d) && !cakeNoticeOk(d)) { d.cake.on = false; notes.push(cakeRemovedMsg()); }

    const id = el.dataset.slot, d = data.draft;

    const notes = [];
    const t = getTheme(d.themeId);

    if (isCakeOn(d) && !cakeNoticeOk(d)) { d.cake.on = false; notes.push(cakeRemovedMsg()); }

    refocus(`[data-action="pick-slot"][data-slot="${id}"]`);
    if (notes.length) toast(notes.join(' '));

  },

    refocus('[data-action="cal-next"]') || refocus('[data-action="cal-prev"]');
  },

      title: 'Cancel this booking?',

    const d = data.draft, notes = [];

    renderCoffee();
